<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link rel="stylesheet" href="landing.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .detail-container {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      text-align: center;
    }
    .detail-container img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .detail-container h2 {
      margin: 0.5rem 0;
    }
    .detail-container p {
      margin: 0.4rem 0;
      font-size: 1rem;
    }
    .price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4CAF50;
    }
    .add-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 5px;
      background: #4CAF50;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    .add-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  <div id="productDetails"></div>

  <script>
   document.addEventListener("DOMContentLoaded", () => {
  const id = parseInt(localStorage.getItem("viewProductId"));

  const defaultProducts = JSON.parse(localStorage.getItem("products")) || [];
  const userProducts = JSON.parse(localStorage.getItem("userProducts")) || [];

  // Merge both arrays
  const products = [...defaultProducts, ...userProducts];

  const product = products.find(p => p.id === id);
  const container = document.getElementById("productDetails");

  if (!product) {
    container.innerHTML = "<p>Product not found.</p>";
    return;
  }

  container.innerHTML = `
    <div class="detail-container">
      <img src="${product.img || 'https://via.placeholder.com/300'}" alt="${product.title}">
      <h2>${product.title}</h2>
      <p class="price">₹${product.price}</p>
      <p><strong>Category:</strong> ${product.category}</p>
      <p>${product.description}</p>
      <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
    </div>
  `;
});


    function addToCart(id) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const products = [
        ...(JSON.parse(localStorage.getItem("products")) || []),
        ...(JSON.parse(localStorage.getItem("userProducts")) || [])
      ];
      const product = products.find(p => p.id === id);
      if (product) {
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
        alert("✅ Added to cart!");
      }
    }
  </script>
</body>
</html>
